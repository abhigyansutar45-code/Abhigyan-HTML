/* ---------- Track generation: closed centerline + roll profile (gravity gates) ---------- */
const mkF=()=>({p:new THREE.Vector3(),T:new THREE.Vector3(),U:new THREE.Vector3(),R:new THREE.Vector3(),kr:0});

const sst=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
function buildTrack(seed,diff,len,fb){const r=RNG(seed),Rb=len/TAU,hm=fb?[]:[2,3,4].map(k=>({k,a:(.04+.1*r())*(.4+.6*diff)*2/k,p:r()*TAU})),hv=fb?[]:[{k:2,a:4+r()*10*diff,p:r()*TAU},{k:3,a:2+r()*5*diff,p:r()*TAU}],M=3000,raw=[];let ymin=1e9;
 for(let i=0;i<M;i++){const th=i/M*TAU;let rr=1,y=0;hm.forEach(h=>rr+=h.a*Math.cos(h.k*th+h.p));hv.forEach(h=>y+=h.a*Math.sin(h.k*th+h.p));ymin=Math.min(ymin,y);raw.push(new THREE.Vector3(Rb*rr*Math.cos(th)*1.15,y,Rb*rr*Math.sin(th)*.8))}
 raw.forEach(p=>p.y+=3-ymin);const cum=[0];for(let i=1;i<=M;i++)cum.push(cum[i-1]+raw[i%M].distanceTo(raw[i-1]));

 for(let i=0;i<N;i++){const s=i*ds;while(j<M-1&&cum[j+1]<s)j++;P.push(new THREE.Vector3().lerpVectors(raw[j],raw[(j+1)%M],(s-cum[j])/(cum[j+1]-cum[j]||1)))}
 const ng=fb?1:1+Math.round(diff*2),gates=[];for(let g=0;g<ng;g++){const a=(g+.5)/ng-.08+(r()-.5)*.08;gates.push({a,len:.09+.05*r(),tgt:(diff>.55&&len>=1400&&g===ng-1)?Math.PI:Math.PI/2*(r()<.5?1:-1)})}

const gravName=u=>u.y>.7?'FLOOR':u.y<-.7?'CEILING':'WALL';
/* ---------- Vehicle physics in track-surface coordinates (prog = distance along route, d = lateral offset) ---------- */
function params(vid,withUp){const v=VEH.find(x=>x.id===vid)||VEH[0],u=withUp?(SAVE.up[vid]||{}):{},a=u.a||0,g=u.g||0,b=u.b||0;return{...v,acc:v.acc*(1+.06*a),grip:v.grip*(1+.08*g),bcap:v.bcap*(1+.15*b)}}
const FF=mkF();
function newCar(id,name,p,col){return{id,name,p,col,prog:0,d:0,vs:0,vl:0,yaw:0,fy:0,fall:0,slip:0,boost:40,lap:0,next:0,lapStart:0,lapTimes:[],finished:false,finTime:0,score:0,combo:{s:0,t:0,idle:0,m:1},line:0,F:mkF(),wp:new THREE.Vector3(),wf:new THREE.Vector3(),wu:new THREE.Vector3(),wr:new THREE.Vector3(),ai:null,boosting:false,onStrip:false}}
function recover(c){c.fall=0;c.fy=0;c.d=0;c.yaw=0;c.vl=0;c.vs=Math.max(22,c.vs*.5);c.slip=0;c.combo.s=0;c.combo.m=1}
function step(c,inp,dt,T){if(c.fall>0){c.fall-=dt;c.fy-=18*dt;if(c.fall<=0)recover(c);return}
 const p=c.p;frameAt(T,c.prog,FF);c.boosting=!!inp.boost&&c.boost>1&&inp.thr>.1;if(c.boosting)c.boost=Math.max(0,c.boost-35*dt);
 const cy=Math.cos(c.yaw),sy=Math.sin(c.yaw);let vf=c.vs*cy+c.vl*sy,vg=-c.vs*sy+c.vl*cy;
 c.yaw+=inp.steer*p.steer*dt*Math.min(1,Math.abs(vf)/10)*(vf<-1?-1:1);if(!inp.steer)c.yaw*=Math.exp(-1.2*dt);c.yaw=clamp(c.yaw,-.8,.8);

function progressUpdate(c,T,laps,time){if(c.next<T.cp.length){if(c.prog>=c.lap*T.L+T.cp[c.next]){c.next++;return'cp'}}else if(c.prog>=(c.lap+1)*T.L){c.lap++;c.next=0;c.lapTimes.push(time-c.lapStart);c.lapStart=time;if(c.lap>=laps){c.finished=true;c.finTime=time;return'fin'}return'lap'}return null}

/* ---------- AI ---------- */
function aiInput(c,cars,T){const a=c.ai,p=c.p;frameAt(T,c.prog+clamp(c.vs*.7,8,45),FF);const ka=Math.abs(FF.kr),inGate=FF.U.y<.6;

let renderer;const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(70,1,.1,3500),_m=new THREE.Matrix4();

const QPR={low:1,med:Math.min(devicePixelRatio||1,1.5),high:Math.min(devicePixelRatio||1,2)};

function setupScene(){scene.add(new THREE.HemisphereLight(0xbcd0ff,0x202048,.95));const s=new THREE.DirectionalLight(0xffffff,.8);s.position.set(200,400,150);scene.add(s);
 const n=1400,pos=new Float32Array(n*3),r=RNG(7);for(let i=0;i<n;i++){const a=r()*TAU,b=Math.acos(2*r()-1),d=1800;pos.set([d*Math.sin(b)*Math.cos(a),d*Math.cos(b),d*Math.sin(b)*Math.sin(a)],i*3)}

function showRecords(){const b=Object.entries(SAVE.best);panel('<h2>Records</h2><pre>'+(b.length?b.map(([k,v])=>`seed-theme-diff-len ${k}\n  best lap ${fmt(v.lap)} · best race ${fmt(v.race)}`).join('\n'):'No records yet.')+`</pre><p class="dim">Races ${SAVE.stats.races} · Wins ${SAVE.stats.wins} · Credits ${SAVE.credits}</p><div class="row">${bk}</div>`)}
function showSettings(){const s=SAVE.set;panel(`<h2>Settings</h2><div class="g"><label>Master volume<input id="s_vol" type="range" min="0" max="1" step=".05" value="${s.vol}"></label><label>Graphics (reload applies AA)<select id="s_q">${['low','med','high'].map(q=>`<option ${q===s.q?'selected':''}>${q}</option>`).join('')}</select></label><label>Speed units<select id="s_u"><option value="kmh" ${s.units==='kmh'?'selected':''}>km/h</option><option value="mph" ${s.units==='mph'?'selected':''}>mph</option></select></label><label>Camera distance<input id="s_c" type="range" min=".8" max="1.4" step=".05" value="${s.cam}"></label></div><div class="row"><button class="pri" data-a="setsave">Save</button><button data-a="resetsave">Reset progress</button>${bk}</div>`)}
function showHelp(){panel(`<h2>Controls</h2><pre>W/↑ accelerate    S/↓ brake/reverse
A/D ←/→ steer     Space handbrake (drift)
Shift boost       C camera (chase/close/hood)
R recover         P / Esc pause
M mute            Tab telemetry
 
Walls and ceilings need speed (≈50+ km/h and ≈80+ km/h) or the car peels off and is recovered.
Drifting and checkpoints charge boost; green strips give a speed kick.</pre><div class="row"><button data-a="tests">Run self-tests</button>${bk}</div>`)}
function showCredits(){panel(`<h2>Credits</h2><p>FRACTURE: GRAVITY CIRCUIT — original fictional game. Rendering: Three.js r128. Audio: Web Audio API (procedural). All geometry generated in code. Gravity and physics are fictional arcade systems.</p><div class="row">${bk}</div>`)}
let prev=null;function clearPreview(){if(prev){disposeGroup(prev);prev=null}}
function showGarage(){clearPreview();state='garage';const sel=VEH.find(v=>v.id===gsel)||VEH[0],p=params(sel.id,true),own=SAVE.unlocked,u=SAVE.up[sel.id]||{a:0,g:0,b:0},bar=(l,v,m)=>`<div class="stat">${l}<div class="bar"><i style="width:${v/m*100}%"></i></div></div>`;
 prev=new THREE.Group();const cm=carMesh(SAVE.paint[sel.id]?parseInt(SAVE.paint[sel.id].slice(1),16):sel.col);prev.add(cm);prev.userData.car=cm;scene.add(prev);
 const upC=k=>120*((u[k]||0)+1);
 panel(`<h2>Garage</h2><div class="row">${VEH.map(v=>`<button data-a="gsel" data-id="${v.id}" ${v.id===sel.id?'class="pri"':''}>${v.n}${own.includes(v.id)?'':' 🔒'}</button>`).join('')}</div><p class="dim">${sel.d}</p>${bar('Accel',p.acc,36)}${bar('Top speed',p.top,80)}${bar('Handling',p.steer*3+p.grip,30)}${bar('Grip',p.grip,12)}${bar('Boost',p.bcap,220)}${bar('Mass',p.mass,2)}
 <div class="row"><input id="g_col" type="color" value="#${(SAVE.paint[sel.id]?parseInt(SAVE.paint[sel.id].slice(1),16):sel.col).toString(16).padStart(6,'0')}" aria-label="Paint"><button data-a="paint">Apply paint</button></div>
 ${own.includes(sel.id)?`<div class="row"><button data-a="use" ${SAVE.veh===sel.id?'disabled':''}>Select</button>${[['a','Engine'],['g','Grip'],['b','Boost']].map(([k,n])=>`<button data-a="upg" data-k="${k}" ${(u[k]||0)>=3?'disabled':''}>${n} L${u[k]||0}/3 (${(u[k]||0)>=3?'max':upC(k)+'c'})</button>`).join('')}</div>`:`<div class="row"><button class="pri" data-a="buy" data-id="${sel.id}" ${SAVE.credits<sel.cost?'disabled':''}>Unlock for ${sel.cost} credits</button></div>`}
 <div class="dim">Credits: ${SAVE.credits}</div><div class="row">${bk}</div>`)}
let lab={seed:777,diff:.5,len:1500,track:null,theme:0};
function showLab(gen){if(gen||!lab.track)lab.track=genTrack(lab.seed,lab.diff,lab.len);const T=lab.track,r=T.report;
 panel(`<h2>Circuit Lab</h2><div class="g"><label>Seed<input id="l_seed" type="number" value="${lab.seed}"></label><label>Difficulty<input id="l_diff" type="number" min=".1" max="1" step=".1" value="${lab.diff}"></label><label>Length m<input id="l_len" type="number" min="800" max="3000" step="100" value="${lab.len}"></label><label>Theme<select id="l_th">${thOpts(lab.theme)}</select></label></div><canvas id="l_cv" width="300" height="200" style="width:100%;background:#050816;border-radius:8px"></canvas>
 <pre class="${r.ok?'ok':'bad'}">${r.fallback?'FALLBACK TRACK — ':''}${r.ok?'VALID':'issues'}: attempts ${r.attempts}, length ${T.L.toFixed(0)} m, min radius ${isFinite(r.minRadius)?r.minRadius.toFixed(0):'∞'} m, checkpoints ${r.checkpoints}\n${r.issues.join('\n')}</pre>
 <pre>Segments (${T.N} samples)\n${T.gates.map((g,i)=>`Gravity gate ${i+1}: ${(g.a*T.L).toFixed(0)}–${((g.a+g.len)*T.L).toFixed(0)} m → ${Math.round(g.tgt/D2R)}° roll`).join('\n')}\n${T.strips.map((s,i)=>`Boost strip ${i+1}: ${s.s0.toFixed(0)} m`).join('\n')}</pre>
 <div class="row"><button data-a="labgen">Generate</button><button data-a="labrand">Random seed</button><button class="pri" data-a="labrace">Race it</button>${bk}</div>`);drawMap($('l_cv'),T)}
const D2R=Math.PI/180;
function readLab(){lab.seed=Math.floor(+$('l_seed').value)||1;lab.diff=clamp(+$('l_diff').value||.5,.1,1);lab.len=clamp(+$('l_len').value||1500,800,3000);lab.theme=+$('l_th').value|0}
const ACT={menu:showMenu,camp:showCamp,setup:d=>showSetup(d.m),start:d=>startRace(readCfg(d.m)),campgo:d=>{const i=+d.i,c=CAMP[i];startRace({mode:'campaign',theme:c.theme,seed:c.seed,diff:c.diff,laps:c.laps,len:c.len,ci:i})},
 resume:togglePause,restart:()=>{const c=R.cfg;startRace(c)},quit:()=>{endRace();showMenu()},records:showRecords,settings:showSettings,help:showHelp,credits:showCredits,
 garage:()=>{gsel=SAVE.veh;showGarage()},gsel:d=>{gsel=d.id;showGarage()},use:()=>{if(SAVE.unlocked.includes(gsel)){SAVE.veh=gsel;saveNow()}showGarage()},
 buy:d=>{const v=VEH.find(x=>x.id===d.id);if(SAVE.credits>=v.cost&&!SAVE.unlocked.includes(v.id)){SAVE.credits-=v.cost;SAVE.unlocked.push(v.id);saveNow()}showGarage()},
 upg:d=>{const id=gsel,u=SAVE.up[id]||(SAVE.up[id]={a:0,g:0,b:0}),lv=u[d.k]||0,c=120*(lv+1);if(lv<3&&SAVE.credits>=c){SAVE.credits-=c;u[d.k]=lv+1;saveNow()}showGarage()},
 paint:()=>{SAVE.paint[gsel]=$('g_col').value;saveNow();showGarage()},
 lab:()=>showLab(false),labgen:()=>{readLab();showLab(true)},labrand:()=>{readLab();lab.seed=Math.floor(Math.random()*99999);showLab(true)},labrace:()=>{readLab();startRace({mode:'quick',theme:lab.theme,seed:lab.seed,diff:lab.diff,laps:2,len:lab.len})},
 setsave:()=>{SAVE.set.vol=+$('s_vol').value;SAVE.set.q=$('s_q').value;SAVE.set.units=$('s_u').value;SAVE.set.cam=+$('s_c').value;if(mg)mg.gain.value=muted?0:SAVE.set.vol;saveNow();showMenu()},
 resetsave:()=>{if(confirm('Erase all progress and settings?')){SAVE=defSave();saveNow();showMenu()}},tests:runTests};
let gsel='vector';
ui.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;audio();beep(660,.05,'square',.06);try{ACT[b.dataset.a](b.dataset)}catch(err){console.error(err);ui.innerHTML='<div class="card"><h2>Error</h2><p class="bad">'+err.message+'</p><button data-a="menu">Menu</button></div>'}});
/* ---------- Self-tests (run in-app) ---------- */
function runTests(){const out=[],t=(n,f)=>{try{const v=f();out.push((v===true?'PASS ':'FAIL ')+n+(v===true?'':' — '+v))}catch(e){out.push('FAIL '+n+' — '+e.message)}},near=(a,b,e=1e-6)=>Math.abs(a-b)<e;
 t('Seeded RNG deterministic',()=>{const a=RNG(5),b=RNG(5),c=RNG(6);return a()===b()&&a()===b()&&RNG(5)()!==c()});
 const T1=genTrack(42,.5,1500);t('Track generation deterministic',()=>{const T2=genTrack(42,.5,1500);return near(T1.L,T2.L)&&T1.P[10].distanceTo(T2.P[10])<1e-9});
 t('Track validates; checkpoints reachable in order',()=>T1.report.ok&&T1.report.checkpoints===T1.cp.length||T1.report.issues.join());
 t('Frames orthonormal & track closed',()=>{for(let i=0;i<T1.N;i+=7){if(!near(T1.U[i].dot(T1.T[i]),0,1e-6)||!near(T1.R[i].length(),1,1e-6))return'bad frame '+i}return T1.P[0].distanceTo(T1.P[T1.N-1])<T1.ds*1.5});
 t('Gravity gate produces wall/ceiling surface',()=>T1.U.some(u=>u.y<.3));
 t('Generation failure is bounded with fallback',()=>{const f=genTrack(3,.5,50);return f.report.fallback===true&&f.report.attempts===6&&f.N>0});
 t('Checkpoint order & lap completion',()=>{const T={L:1000,cp:[100,300,600]},c=newCar('x','x',params('vector'),0);c.prog=50;if(progressUpdate(c,T,2,0))return'early';c.prog=150;progressUpdate(c,T,2,1);if(c.next!==1)return'cp0';c.prog=1100;progressUpdate(c,T,2,2);if(c.lap!==0)return'lap counted early';c.prog=700;progressUpdate(c,T,2,3);progressUpdate(c,T,2,3);if(c.next!==3)return'order';c.prog=1010;return progressUpdate(c,T,2,4)==='lap'&&c.lap===1});
 t('Save validation & migration',()=>validSave(defSave())&&!validSave({v:1})&&!validSave(null)&&validSave(migrate({credits:5})));
 t('Gravity rotation stable through 180° flip',()=>{const g=new THREE.Vector3(0,-1,0),tg=new THREE.Vector3(0,1,0);let ang=Math.PI;for(let i=0;i<30;i++){rotToward(g,tg,.2);if(!isFinite(g.x)||!near(g.length(),1,1e-6))return'unstable'}return g.angleTo(tg)<.2});
 t('Physics: accelerate, brake, off-track fall, recovery',()=>{const c=newCar('t','t',params('vector'),0);c.mesh=null;for(let i=0;i<120;i++)step(c,{thr:1,brk:0,steer:0,hb:0,boost:0},STEP,T1);const v=c.vs;if(!(v>10&&v<params('vector').top*1.3))return'speed '+v;for(let i=0;i<60;i++)step(c,{thr:0,brk:1,steer:0,hb:0,boost:0},STEP,T1);if(!(c.vs<v))return'brake';c.d=T1.w;step(c,{thr:0,brk:0,steer:0,hb:0,boost:0},STEP,T1);if(!(c.fall>0))return'no fall';for(let i=0;i<90;i++)step(c,{thr:0,brk:0,steer:0,hb:0,boost:0},STEP,T1);return c.fall===0&&c.d===0});
 panel('<h2>Self-tests</h2><pre>'+out.join('\n')+'\n\n'+out.filter(x=>x[0]==='P').length+'/'+out.length+' passed</pre><div class="row"><button data-a="help">Back</button></div>')}
/* ---------- Main loop ---------- */
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.1,(t-last)/1000);last=t;
 if(R&&state!=='paused'&&state!=='results'){acc+=dt;let n=0;while(acc>=STEP&&n<5){simulate(STEP);acc-=STEP;n++}if(n===5)acc=0}
 if(R){R.cars.forEach(c=>placeCar(c,R.T));updateCam(dt);hudT+=dt;if(hudT>.08){hudT=0;updateHUD(dt);}if(performance.now()>=mmT){mmT=performance.now()+100;drawMap($('mm'),R.T,R.cars,R.player)}
  if(engG){const sp=Math.abs(R.player.vs);engG.gain.value=state==='racing'||state==='finishing'?.05:0;eng.frequency.value=50+sp*3.2+(R.player.boosting?40:0)}}
 else{if(engG)engG.gain.value=0;const tm=t/1000;if(prev){prev.rotation.y=tm*.6;cam.position.set(0,2.2,8);cam.up.set(0,1,0);cam.lookAt(0,.8,0)}else{cam.position.set(Math.sin(tm*.1)*14,4,Math.cos(tm*.1)*14);cam.up.set(0,1,0);cam.lookAt(0,2,0)}}
 renderer.render(scene,cam)}
$('pbtn').onclick=togglePause;
try{initGL();setupScene();showMenu();requestAnimationFrame(frame)}catch(e){fatal(e.message)}
</script></body></html>
